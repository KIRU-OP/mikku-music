[package]
name = "mikku"
version = "0.1.0"
edition = "2021"
description = "Mikku Music - Telegram voice chat music bot (Rust port)"

[dependencies]
tokio = { version = "1", features = ["full"] }
ferogram = "0.6.6"
tgcalls = "0.3"
mongodb = "3"
bson = "2"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies"] }
regex = "1"
once_cell = "1"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
chrono = "0.4"
rand = "0.8"
url = "2"
percent-encoding = "2"
async-trait = "0.1"
dashmap = "6"
image = "0.25"
imageproc = "0.25"
ab_glyph = "0.2"
sysinfo = "0.32"
base64 = "0.22"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
