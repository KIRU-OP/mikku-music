name: Go migration checks

on:
  push:
    branches: [go-only-final]
  pull_request:
    branches: [main]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - 'Dockerfile.go'
      - '.github/workflows/go-migration.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: true
      - name: Resolve dependencies
        run: go mod tidy
      - name: Format Go sources
        run: find . -type f -name '*.go' -not -path './vendor/*' -print0 | xargs -0 gofmt -w
      - name: Check whitespace errors
        run: git diff --check
      - name: Test
        run: go test -race ./...
      - name: Build
        run: go build ./cmd/mikku
